version: '3.8'

services:
  postgres:
    image: postgres:latest
    hostname: postgres
    container_name: postgres-stock-alert
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stock-alert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: duchuy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stock-alert-network

  rabbitmq:
    image: "rabbitmq:management"
    container_name: rabbitmq-stock-alert
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/data
    networks:
      - stock-alert-network

  influxdb:
    image: influxdb:latest
    container_name: influxdb-stock-alert
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: stock-alert
      INFLUXDB_ADMIN_USER: influx
      INFLUXDB_ADMIN_PASSWORD: duchuy1311
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - stock-alert-network

  flink-jobmanager:
    image: flink:latest
    container_name: flink-jobmanager
    ports:
      - "8082:8081"
      - "6123:6123"
    environment:
      - TASK_MANAGER_HEAP_SIZE=1024m
      - JOB_MANAGER_HEAP_SIZE=1024m
      - FLINK_PROPERTIES=jobmanager.rpc.address:flink-jobmanager
    command: jobmanager
    volumes:
      - flink-job:/opt/flink/usrlib
    depends_on:
      - rabbitmq
      - influxdb
    networks:
      - stock-alert-network

  flink-taskmanager:
    image: flink:latest
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_HEAP_SIZE=1024m
    command: taskmanager
    volumes:
      - flink-job:/opt/flink/usrlib
    links:
      - flink-jobmanager
    networks:
      - stock-alert-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-app-stock-alert
    links:
      - postgres
      - rabbitmq
      - influxdb
      - flink-jobmanager
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock-alert
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: duchuy
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: bW6eoLcswptcDR1Y8n_-7vyccwdeutBgU7grHtU9Mct8cKCVdv7wqLVLXTdAWQ2iHiW7YNXPp3cl2aheLqf5cw==
      INFLUXDB_ORG: stock-alert
      INFLUXDB_BUCKET: stock-alert
      SELENIUM_URL: http://selenium:4444/wd/hub
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - rabbitmq
      - influxdb
      - flink-jobmanager
    networks:
      - stock-alert-network

volumes:
  postgres-data:
  influxdb-data:
  rabbitmq-data:
  flink-job:

networks:
  stock-alert-network:
    driver: bridge